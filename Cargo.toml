[package]
name = "speakspic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
cpal = "0.18.1"
dirs = "6.0.0"
futures-util = "0.3.34"
gtk = { version = "0.11.4", package = "gtk4" }
gtk4-layer-shell = "0.8.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.4"
